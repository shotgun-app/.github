name: Task
description: A concrete piece of technical work, usually part of a user story.
title: "<TITLE HERE>"
labels: ["task"]
body:
  - type: input
    id: parent
    attributes:
      label: Related user story
      description: Link the story this task belongs to, if any.
      placeholder: "#123"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why?
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: To do
      description: Break the work into steps.
      value: |
        - [ ] Meets the [Definition of Done](https://github.com/shotgun-app/.github/blob/main/docs/social-contract.md#definition-of-done)
        - [ ]
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Technical details, links, or anything else useful.
    validations:
      required: false
